# Release-sweep pin — read by hpc/batch_gpu/submit_release_sweep.sh (shell) and by
# scripts/misc/tooling/build_dashboard.py (Python). KEY=VALUE, no quotes, no expansion.
#
# The run-time dashboard plots one point per PyAutoLens release per likelihood cell. Those
# points are only a trend if every release's A100 rows come from the SAME quiet host: the
# laptop drifts 2.5x between runs, GitHub runners are unsuitable, and node-to-node A100
# differences are the same class of confound as a seeded autotune cache
# (results/notes/xla_autotune_triton_gemm.md). So the sweep is pinned, and a row whose
# provenance says otherwise is flagged (off host) or refused (loaded host) on the dashboard.

# The A100 node every release sweep is submitted to (`sbatch --nodelist`). euclid-ral-gpu-2
# carried the 2026-09-10 pixelized baseline (jobs 342617-342628) and the fixed-light,
# residue and point-source A100 rows since.
RELEASE_SWEEP_NODE=euclid-ral-gpu-2

# 1-minute load average at import above which a row is refused as a trend point (it stays
# in the tree and in the ledger; the dashboard lists it under "refused"). 8 is well above
# a quiet node's idle load and well below the ~200 of the loaded 8490H that inflated the
# point-source IP-4b absolutes (job 357321).
RELEASE_SWEEP_LOADAVG_CAP=8.0
