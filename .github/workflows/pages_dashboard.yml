name: Pages Dashboard

# Serves the run-time-over-time dashboard (`dashboard/index.html`, its data
# `series.json`, the project badge feed `state.json` and the PyAutoPulse read
# contract `summary.json`) at this repo's GitHub
# Pages URL. The files are rendered by `scripts/misc/tooling/build_dashboard.py`
# — on release tags by `profile.yml`, by hand after a sweep is committed — and
# this workflow only publishes them (autolens_profiling#345). Only the uploaded
# files reach Pages: nothing else in the repo.
#
# The badge uses the Brain feed contract (board/_state.py); a feed that has
# drifted from it fails before Pages publishes. The Brain cockpit reads the
# PyAutoPulse organ feed, not this project's badge.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain
      # enablement: true creates the Pages site on first run, so no manual
      # Settings -> Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage the dashboard as the site
        run: |
          mkdir -p _site
          cp dashboard/index.html _site/index.html
          cp dashboard/series.json _site/series.json
          cp dashboard/state.json _site/state.json
          cp dashboard/summary.json _site/summary.json
      - name: Validate the project badge feed against the Brain contract
        run: python3 PyAutoBrain/board/_state.py _site/state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell the PyAutoPulse dashboard to refresh (repository_dispatch pulse-refresh)
        env:
          GH_TOKEN: ${{ secrets.PAT_PYAUTOLABS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PAT_PYAUTOLABS is not available to this repo — skipping the pulse-refresh dispatch to PyAutoLabs/PyAutoPulse."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          gh api repos/PyAutoLabs/PyAutoPulse/dispatches \
            -f event_type=pulse-refresh \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[sha]=${sha}" \
            -f "client_payload[summary]=dashboard/summary.json"
          echo "Dispatched pulse-refresh to PyAutoLabs/PyAutoPulse (${{ github.repository }}@${sha})."
